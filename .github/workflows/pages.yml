name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/life-countdown-app-283b]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: true
    steps:
      - name: Enable GitHub Pages if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/pages \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow || true
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
      - name: Enable Pages from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/pages \
            -H "Accept: application/vnd.github+json" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" || \
          gh api --method PUT repos/${{ github.repository }}/pages \
            -H "Accept: application/vnd.github+json" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" || true
